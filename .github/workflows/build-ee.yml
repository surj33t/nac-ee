---
# Builds the NaC EE for amd64 + arm64, smoke-tests it, and pushes to GHCR.
# - PRs: build + smoke test only (no push)
# - main: push :<VERSION>-<sha> and :latest-main
# - tag v*: push the release tag :<VERSION> (immutable - never re-push a released tag)
name: build-ee

on:
  pull_request:
    paths: ["execution-environment.yml", "dependencies/**", "files/**", "VERSION", ".github/workflows/build-ee.yml"]
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/nac-ee
  ANSIBLE_BUILDER_VERSION: "3.2.0"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Generate build context with ansible-builder
        run: |
          pip install "ansible-builder==${ANSIBLE_BUILDER_VERSION}"
          ansible-builder create -f execution-environment.yml -c context --output-filename Containerfile
          echo "VERSION=$(cat VERSION)" >> "$GITHUB_ENV"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Tags
        id: meta
        run: |
          short=$(git rev-parse --short HEAD)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "tags=${IMAGE}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=${IMAGE}:${VERSION}-${short},${IMAGE}:latest-main" >> "$GITHUB_OUTPUT"
          fi

      # 1) Build amd64 into the local daemon and smoke-test it before anything is pushed
      - name: Build (amd64, load for test)
        uses: docker/build-push-action@v6
        with:
          context: context
          file: context/Containerfile
          platforms: linux/amd64
          load: true
          tags: nac-ee:test
          build-args: |
            EE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: docker run --rm nac-ee:test ee-smoke-test

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2) Multi-arch build + push (arm64 so the same tag runs on an Apple Silicon VM)
      - name: Build and push (amd64 + arm64)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: context
          file: context/Containerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            EE_VERSION=${{ env.VERSION }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          provenance: true
          sbom: true
